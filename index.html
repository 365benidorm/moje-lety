<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12182B">
<meta name="description" content="Osobní letecký deník a cestovní sbírka. Ruční zadání, PDF a QR import, plná databáze letišť světa. Bez závislosti na třetí straně.">
<title>Moje Lety – letecký deník</title>
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --navy:#12182B;
    --navy-2:#1B2340;
    --navy-3:#232C4E;
    --paper:#F3EDDD;
    --paper-2:#e9e0c8;
    --brass:#D3A94C;
    --brass-dark:#B8923F;
    --teal:#4A9B94;
    --stamp:#C1543A;
    --ink:#1E2233;
    --mist2:#8892B0;
    --line:rgba(255,255,255,.10);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--navy);
    color:#EDEFF7;
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
    background:linear-gradient(180deg, var(--navy-2), var(--navy));
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-sans);
    font-weight:800;
    font-size:19px;
    letter-spacing:.2px;
  }
  .brand svg{ width:22px; height:22px; }
  .sync-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--mist2);
    box-shadow:0 0 0 3px rgba(255,255,255,.06);

    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.2px;

    margin:18px 2px 10px;
    font-weight:700;
  }
  .empty{
    text-align:center;
    color:var(--mist2);
    padding:40px 16px;
    border:1px dashed var(--line);
    border-radius:16px;
    font-size:14px;
    line-height:1.5;
  }

    color:var(--ink);
    border-radius:14px;

    box-shadow:0 3px 10px rgba(0,0,0,.28);

  }
  .flight-card .fc-main{
    flex:1;
    padding:13px 14px;
    min-width:0;
  }
  .fc-route{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono);
    font-weight:700;
    font-size:20px;
    letter-spacing:.5px;
  }
  .fc-route svg{ width:16px; height:16px; flex:none; color:var(--brass-dark); }
  .fc-sub{
    margin-top:4px;
    font-size:12.5px;
    color:#5b5644;
    display:flex; gap:10px; flex-wrap:wrap;

  .fc-airline{ font-weight:600; }
  .flight-card .fc-stub{
    width:70px; flex:none;

  .settings-block{ background:var(--navy-2); border-radius:14px; padding:14px; margin-bottom:16px; }
  .settings-block p{ font-size:13px; color:var(--mist2); line-height:1.5; margin:4px 0 0; }
  .settings-block h3{ font-size:14.5px; margin:0 0 4px; }
  .toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%);

    font-size:13.5px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.4);
    z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  /* ---------- Tab bar ---------- */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0;
    max-width:560px; margin:0 auto;
    display:flex;
    background:linear-gradient(0deg, var(--navy) 60%, rgba(18,24,43,.97));

  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--mist2); font-size:10.5px; font-weight:700; padding:6px 2px; border-radius:10px;

  /* ---------- Lock screen (přihlášení + 2FA) ---------- */
  #lockScreen{

  .lock-card h2{ margin:0 0 4px; font-size:20px; }
  .lock-card p.lock-sub{ margin:0 0 18px; font-size:13px; color:#5b5644; line-height:1.5; }
  .lock-card label{ color:#5b5644; }
  .lock-card input{ background:#fff; border:1px solid rgba(30,34,51,.2); color:var(--ink); }
  .lock-error{ color:var(--stamp); font-size:13px; margin-top:10px; font-weight:600; }
  .lock-code-input{ letter-spacing:6px; font-family:var(--font-mono); font-size:22px; text-align:center; }
  .lock-server-toggle{ font-size:12px; color:#8a836a; text-decoration:underline; cursor:pointer; margin-top:16px; display:inline-block; }
  .lock-server-box{ margin-top:10px; }
  .lock-resend{ font-size:12.5px; color:var(--teal); text-decoration:underline; cursor:pointer; margin-top:10px; display:inline-block; }
</style>

<script>
/* =========================================================================
   MOJE LETY — osobní letecký deník (PWA)
   Vlastní, nezávislá implementace. Žádná data neopouští zařízení, pokud
   sám nezapneš zálohu do vlastního Google Sheets (Nastavení).
   ========================================================================= */

/* ---------------------------- IndexedDB layer --------------------------- */
const DB_NAME = 'flightlog-db';
const DB_VERSION = 1;
let _dbPromise = null;
function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('flights')) db.createObjectStore('flights', {keyPath:'id'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', {keyPath:'key'});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _dbPromise;
}
function dbGetAll(store){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const r = tx.objectStore(store).getAll();
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  }));
}
function dbGet(store,key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const r = tx.objectStore(store).get(key);
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  }));
}
function dbPut(store,value){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  }));
}
function dbDelete(store,key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  }));
}

/* ------------------------------- Utilities ------------------------------ */
function uuid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function julianToISODate(julianDay, year){
  const d = new Date(Date.UTC(year,0,1));
  d.setUTCDate(d.getUTCDate() + (julianDay-1));
  return d.toISOString().slice(0,10);
}
const MONTHS_CS = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
function fmtDateHuman(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  const mi = parseInt(m,10)-1;
  if(mi<0||mi>11||!d) return iso;
  return `${parseInt(d,10)}. ${MONTHS_CS[mi]} ${y}`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* CSV parsing (handles quoted fields, auto ',' or ';' delimiter) */
function detectDelimiter(text){
  const line = text.split(/\r?\n/)[0] || '';
  const commas = (line.match(/,/g)||[]).length;
  const semis = (line.match(/;/g)||[]).length;
  return semis > commas ? ';' : ',';
}
function parseCSV(text, delim){
  const rows = []; let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ field+='"'; i++; } else inQ=false; }
      else field += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === delim){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => (f||'').trim() !== ''));
}

/* ------------------------------ Airport DB ------------------------------ */
let AIRPORTS = [];
let AIRPORT_BY_IATA = new Map();
async function loadAirports(){
  try{
    const res = await fetch('airports.json');
    AIRPORTS = await res.json();
    AIRPORT_BY_IATA = new Map(AIRPORTS.map(a=>[a.iata, a]));
  }catch(e){
    console.error('Nepodařilo se načíst databázi letišť', e);
  }
}
function searchAirports(query, limit=8){
  query = (query||'').trim().toUpperCase();
  if(!query) return [];
  const exact = AIRPORT_BY_IATA.get(query);
  const out = [];
  if(exact) out.push(exact);
  for(const a of AIRPORTS){
    if(out.length >= limit) break;
    if(a.iata === query) continue;
    if(a.iata.startsWith(query) || a.city.toUpperCase().startsWith(query) || a.name.toUpperCase().includes(query) || a.city.toUpperCase().includes(query)){
      out.push(a);
    }
  }
  return out.slice(0, limit);
}

/* -------------------------------- State ---------------------------------- */
const state = {
  activeTab: 'flights',
  addSubtab: 'manual',
  flights: [],
  expandedId: null,
  csvRows: null,
  csvMapping: null,
  scanControls: null,
  authed: false,
  lockStage: 'password', // 'password' | 'code'
  lockError: '',
  lockBusy: false,
};
const AUTH_EMAIL = 'info@krejcijakub.cz';

async function loadFlights(){
  const all = await dbGetAll('flights');
  all.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  state.flights = all;
}
async function saveFlight(flight){
  if(!flight.id) flight.id = uuid();
  if(!flight.createdAt) flight.createdAt = Date.now();
  flight.updatedAt = Date.now();
  await dbPut('flights', flight);
  await loadFlights();
  scheduleAutoSync();
}
async function deleteFlight(id){
  await dbDelete('flights', id);
  await loadFlights();
  scheduleAutoSync();
}
async function getSettings(){
  const row = await dbGet('settings','config');
  return (row && row.value) || {};
}
async function setSettings(patch){
  const cur = await getSettings();
  await dbPut('settings', {key:'config', value:{...cur, ...patch}});
}

/* ------------------------------ Přihlášení (2FA) --------------------------- */
async function serverUrl(){
  const cfg = await getSettings();
  return cfg.sheetsUrl || '';
}
async function callServer(payload, method){
  const url = await serverUrl();
  if(!url) return {error:'no_server'};
  try{
    if(method === 'GET'){
      const full = url + (url.includes('?')?'&':'?') + payload;
      const res = await fetch(full);
      return await res.json();
    }
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
    });
    return await res.json();
  }catch(err){
    console.error(err);
    return {error:'network'};
  }
}
async function checkSession(){
  const cfg = await getSettings();
  if(!cfg.sheetsUrl || !cfg.sessionToken) return false;
  const data = await callServer('action=check&key='+encodeURIComponent(cfg.sessionToken), 'GET');
  return !!data.ok;
}
async function requestLoginCode(password){
  const data = await callServer({action:'login_request', email: AUTH_EMAIL, password});
  return data;
}
async function verifyLoginCode(code){
  const data = await callServer({action:'login_verify', code});
  if(data.ok && data.token){
    await setSettings({sessionToken: data.token});
  }
  return data;
}
async function doLogout(){
  const cfg = await getSettings();
  if(cfg.sessionToken) await callServer({action:'logout', token: cfg.sessionToken});
  await setSettings({sessionToken: ''});
  state.authed = false;
  state.lockStage = 'password';
  renderLockScreen();
}

/* Tichá automatická synchronizace: stáhne při startu, odešle po každé změně */
let autoSyncTimer = null;
function scheduleAutoSync(){
  clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(autoSyncPush, 900); // krátké zpoždění, ať se sloučí rychlé změny za sebou
}
async function autoSyncPush(){
  const cfg = await getSettings();
  if(!cfg.sheetsUrl || !cfg.sessionToken) return;
  const dot = document.getElementById('syncDot');
  if(dot) dot.className = 'sync-dot busy';
  const flights = await dbGetAll('flights');
  const data = await callServer({action:'sync', key: cfg.sessionToken, flights});
  if(dot) dot.className = data.ok ? 'sync-dot ok' : 'sync-dot';
  const lbl = document.getElementById('syncLabel');
  if(lbl && data.ok) lbl.textContent = 'zálohováno';
}
async function autoSyncPull(){
  const cfg = await getSettings();
  if(!cfg.sheetsUrl || !cfg.sessionToken) return;
  const dot = document.getElementById('syncDot');
  if(dot) dot.className = 'sync-dot busy';
  const data = await callServer('action=flights&key='+encodeURIComponent(cfg.sessionToken), 'GET');
  if(data.error){ if(dot) dot.className='sync-dot'; return; }
  let changed = false;
  for(const remote of (data.flights||[])){
    if(!remote.id) continue;
    const local = state.flights.find(f=>f.id===remote.id);
    const remoteUpdated = Number(remote.updatedAt)||0;
    const localUpdated = local ? (Number(local.updatedAt)||0) : -1;
    if(!local || remoteUpdated > localUpdated){
      await dbPut('flights', remote);
      changed = true;
    }
  }
  if(changed) await loadFlights();
  if(dot) dot.className = 'sync-dot ok';
  const lbl = document.getElementById('syncLabel');
  if(lbl) lbl.textContent = 'sesynchronizováno';
  if(changed && state.activeTab !== 'add') renderAll();
}

function wireLockScreen(){
  const pwForm = document.getElementById('lockPasswordForm');
  if(pwForm){
    pwForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const pw = document.getElementById('lockPassword').value;
      state.lockBusy = true; state.lockError=''; renderLockScreen();
      const url = await serverUrl();
      if(!url){
        state.lockBusy=false; state.lockError='Nejdřív nastav adresu serveru níže.'; renderLockScreen(); return;
      }
      const res = await requestLoginCode(pw);
      state.lockBusy = false;
      if(res.ok){ state.lockStage='code'; state.lockError=''; }
      else state.lockError = 'Nesprávné přihlašovací údaje.';
      renderLockScreen();
    });
  }
  const codeForm = document.getElementById('lockCodeForm');
  if(codeForm){
    codeForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const code = document.getElementById('lockCode').value.trim();
      state.lockBusy = true; state.lockError=''; renderLockScreen();
      const res = await verifyLoginCode(code);
      state.lockBusy = false;
      if(res.ok){
        state.authed = true;
        document.getElementById('app').style.display = '';
        document.getElementById('lockScreen').style.display = 'none';
        await loadAirports();
        await loadFlights();
        renderAll();
        autoSyncPull();
      } else {
        state.lockError = 'Neplatný nebo vypršelý kód.';
        renderLockScreen();
      }
    });
    const resend = document.getElementById('lockResend');
    if(resend) resend.addEventListener('click', ()=>{ state.lockStage='password'; state.lockError=''; renderLockScreen(); });
  }
  const toggle = document.getElementById('lockServerToggle');
  if(toggle){
    toggle.addEventListener('click', async ()=>{
      const box = document.getElementById('lockServerBox');
      box.style.display = box.style.display==='none' ? 'block' : 'none';
      document.getElementById('lockServerUrl').value = await serverUrl();
    });
  }
  const saveServerBtn = document.getElementById('lockServerSave');
  if(saveServerBtn){
    saveServerBtn.addEventListener('click', async ()=>{
      const val = document.getElementById('lockServerUrl').value.trim();
      await setSettings({sheetsUrl: val});
      showToast('Adresa uložena.');
    });
  }
}

function guessMapping(headers){
  return headers.map(h=>{

      <button class="btn btn-primary" id="csvConfirmBtn">Importovat ${rows.length} letů</button>
      <button class="btn btn-ghost" id="csvCancelBtn">Zrušit</button>
    </div>
  </div>`;
}

/* -------------------------------- Stats view ------------------------------- */
function computeStats(){
  const fl = state.flights;
  const airportsSet = new Set();
  const countrySet = new Set();
  const airlineCounts = {};
  const yearCounts = {};
  let totalKm = 0, validDistLegs = 0;
  for(const f of fl){
    if(f.origin) airportsSet.add(f.origin);
    if(f.destination) airportsSet.add(f.destination);
    const o = AIRPORT_BY_IATA.get(f.origin), d = AIRPORT_BY_IATA.get(f.destination);
    if(o) countrySet.add(o.country);
    if(d) countrySet.add(d.country);
    if(o && d){ totalKm += haversineKm(o.lat,o.lon,d.lat,d.lon); validDistLegs++; }
    const carrier = (f.flightNumber||'').replace(/[0-9\s]/g,'').slice(0,2) || (f.airline||'').slice(0,2);
    if(carrier) airlineCounts[carrier] = (airlineCounts[carrier]||0)+1;
    const y = (f.date||'').slice(0,4);
    if(y) yearCounts[y] = (yearCounts[y]||0)+1;
  }
  const totalHours = totalKm / 800 + validDistLegs*0.5; // odhad: 800 km/h průměr + 30 min na let navíc
  const topAirlines = Object.entries(airlineCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return {
    total: fl.length,
    airports: airportsSet.size,
    countries: countrySet.size,
    totalKm: Math.round(totalKm),
    totalHours: Math.round(totalHours*10)/10,
    yearCounts, topAirlines,
  };
}
function renderStatsView(){
  if(!state.flights.length){
    return `<div class="empty">Statistiky se objeví, jakmile přidáš první let.</div>`;
  }
  const s = computeStats();
  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="num">${s.total}</div><div class="lbl">letů celkem</div></div>
    <div class="stat-card"><div class="num">${s.airports}</div><div class="lbl">letišť navštíveno</div></div>
    <div class="stat-card"><div class="num">${s.countries}</div><div class="lbl">zemí</div></div>
    <div class="stat-card"><div class="num">${s.totalKm.toLocaleString('cs-CZ')}</div><div class="lbl">km nalétáno</div></div>
  </div>
  <h2 class="section-title">Odhad strávený ve vzduchu</h2>
  <div class="stat-card" style="margin-bottom:18px;"><div class="num">${s.totalHours} h</div><div class="lbl">hrubý odhad (běžná cestovní rychlost)</div></div>
  <h2 class="section-title">Lety podle roku</h2>
  <canvas id="yearChart"></canvas>
  <h2 class="section-title">Nejčastější aerolinky</h2>
  <div class="chip-list">
    ${s.topAirlines.map(([c,n])=>`<div class="chip">${escapeHtml(c)} · ${n}×</div>`).join('') || '<span style="color:var(--mist2);font-size:13px;">nezjištěno</span>'}
  </div>
  `;
}
function drawYearChart(){
  const canvas = document.getElementById('yearChart');
  if(!canvas) return;
  const s = computeStats();
  const years = Object.keys(s.yearCounts).sort();
  if(!years.length) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = 160 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const w = rect.width, h = 160;
  ctx.clearRect(0,0,w,h);
  const max = Math.max(...years.map(y=>s.yearCounts[y]));
  const barW = Math.min(40, (w-20) / years.length - 10);
  const gap = (w - barW*years.length) / (years.length+1);
  ctx.font = '11px -apple-system, sans-serif';
  years.forEach((y,i)=>{
    const val = s.yearCounts[y];
    const bh = (val/max) * (h-40);
    const x = gap + i*(barW+gap);
    const yTop = h - 24 - bh;
    ctx.fillStyle = '#D3A94C';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, yTop, barW, bh, 4) : ctx.rect(x, yTop, barW, bh);
    ctx.fill();
    ctx.fillStyle = '#EDEFF7';
    ctx.textAlign = 'center';
    ctx.fillText(val, x+barW/2, yTop-6);
    ctx.fillStyle = '#8892B0';
    ctx.fillText(y, x+barW/2, h-8);
  });
}

function wireAutocomplete(inputId, listId, onPick){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if(!input) return;
  input.addEventListener('input', ()=>{
    const q = input.value;
    const results = searchAirports(q, 8);
    if(!results.length){ list.style.display='none'; return; }
    list.innerHTML = results.map(a=>`<div class="autocomplete-item" data-iata="${a.iata}"><b>${a.iata}</b>${escapeHtml(a.city)} — ${escapeHtml(a.name)}</div>`).join('');
    list.style.display = 'block';
    list.querySelectorAll('.autocomplete-item').forEach(it=>{
      it.addEventListener('click', ()=>{
        input.value = it.dataset.iata;
        list.style.display = 'none';
        if(onPick) onPick(it.dataset.iata);
      });
    });
  });
  input.addEventListener('blur', ()=> setTimeout(()=>{ list.style.display='none'; }, 150));
}

/* -------------------------------- PDF import ------------------------------- */
let pdfjsReady = false;
function ensurePdfJs(){
  if(pdfjsReady) return Promise.resolve(true);
  return new Promise((resolve)=>{
    if(window.pdfjsLib){ pdfjsReady = true; resolve(true); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      pdfjsReady = true; resolve(true);
    };
    s.onerror = ()=> resolve(false);
    document.head.appendChild(s);
  });
}
async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data: buf}).promise;
  let text = '';
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return text;
}
const MONTH_ABBR = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
function guessFlightFromText(text){
  const upper = text.toUpperCase();
  const codeMatches = [...upper.matchAll(/\b[A-Z]{3}\b/g)].map(m=>m[0]);
  const validCodes = [];
  for(const c of codeMatches){
    if(AIRPORT_BY_IATA.has(c) && !validCodes.includes(c)) validCodes.push(c);
    if(validCodes.length >= 6) break;
  }
  let flightNumber = '';
  const fm = upper.match(/\b([A-Z]{2}|[0-9][A-Z]|[A-Z][0-9])\s?(\d{1,4})\b/);
  if(fm) flightNumber = fm[1].trim() + fm[2].trim();
  let date = '';
  let dm = upper.match(/\b(\d{1,2})\s?(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\s?(\d{2,4})\b/);
  if(dm){
    let yr = dm[3].length===2 ? (2000+parseInt(dm[3],10)) : parseInt(dm[3],10);
    date = `${yr}-${String(MONTH_ABBR[dm[2]]).padStart(2,'0')}-${String(parseInt(dm[1],10)).padStart(2,'0')}`;
  } else {
    dm = upper.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);
    if(dm) date = `${dm[1]}-${dm[2]}-${dm[3]}`;
    else {
      dm = upper.match(/\b(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})\b/);
      if(dm){
        let yr = dm[3].length===2 ? (2000+parseInt(dm[3],10)) : parseInt(dm[3],10);
        date = `${yr}-${String(parseInt(dm[2],10)).padStart(2,'0')}-${String(parseInt(dm[1],10)).padStart(2,'0')}`;
      }
    }
  }
  let pnr = '';
  const pm = text.match(/(?:PNR|Booking reference|Rezervačn[íi] k[óo]d|Reservation code)[:\s]*([A-Z0-9]{5,8})/i);
  if(pm) pnr = pm[1];
  return { origin: validCodes[0]||'', destination: validCodes[1]||'', flightNumber, date, pnr };
}

  document.getElementById('pdfResult').innerHTML = `<p style="color:var(--mist2);font-size:13px;">Čtu PDF…</p>`;

}

function parseBCBP(raw){
  if(!raw || raw[0] !== 'M') return null;
  try{
    const legs = parseInt(raw[1],10) || 1;
    const name = raw.slice(2,22).trim();
    const pnr = raw.slice(23,30).trim();
    const from = raw.slice(30,33).trim();
    const to = raw.slice(33,36).trim();
    const carrier = raw.slice(36,39).trim();
    const flightNumRaw = raw.slice(39,44).trim().replace(/^0+/,'');
    const julianStr = raw.slice(44,47).trim();
    const julianDay = parseInt(julianStr,10);
    const compartment = raw.slice(47,48).trim();
    const seat = raw.slice(48,52).trim();
    const sequence = raw.slice(52,57).trim();
    const [lastName,firstName] = name.split('/');
    if(!from || !to || isNaN(julianDay)) return null;
    return { legs, lastName:lastName||'', firstName:firstName||'', pnr, from, to, carrier,
      flightNumber: (carrier+flightNumRaw).trim(), julianDay, compartment, seat, sequence, raw };
  }catch(e){ return null; }
}
function bcbpToDraft(parsed, year){
  return {
    date: julianToISODate(parsed.julianDay, year),
    origin: parsed.from, destination: parsed.to,
    flightNumber: parsed.flightNumber, seat: parsed.seat, pnr: parsed.pnr,
  };
}

async function startCameraScan(){
  const area = document.getElementById('scanArea');
  const ok = await ensureZXing();
  if(!ok){
    area.innerHTML = `<p style="color:var(--stamp);font-size:13px;">Knihovnu pro čtení kódů se nepodařilo načíst (potřeba jednorázově internet).</p>`;
    return;
  }
  area.innerHTML = `<video id="scanVideo" playsinline muted></video><div class="scan-hint">Namiř kameru na QR/čárový kód. Skenování se zastaví po nalezení kódu.</div><button class="btn btn-ghost btn-block" id="stopScanBtn" style="margin-top:10px;">Zastavit</button>`;
  try{
    const hints = new Map();
    hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, [window.ZXing.BarcodeFormat.QR_CODE, window.ZXing.BarcodeFormat.PDF_417]);
    const reader = new window.ZXing.BrowserMultiFormatReader(hints);
    const devices = await window.ZXing.BrowserMultiFormatReader.listVideoInputDevices();
    const backCam = devices.find(d=>/back|rear|environment/i.test(d.label)) || devices[devices.length-1];
    const controls = await reader.decodeFromVideoDevice(backCam ? backCam.deviceId : undefined, 'scanVideo', (result, err)=>{
      if(result){
        controls.stop();
        state.scanControls = null;
        handleScanResult(result.getText());
      }
    });
    state.scanControls = controls;
    document.getElementById('stopScanBtn').addEventListener('click', ()=>{
      controls.stop(); state.scanControls=null; area.innerHTML='';
    });
  }catch(err){
    console.error(err);
    area.innerHTML = `<p style="color:var(--stamp);font-size:13px;">Kameru se nepodařilo spustit (potřebuje HTTPS a povolení přístupu). Zkus nahrát fotku kódu místo toho.</p>`;
  }
}
async function handleScanImageFile(file){
  const area = document.getElementById('scanArea');
  area.innerHTML = `<p style="color:var(--mist2);font-size:13px;">Analyzuji fotku…</p>`;
  const ok = await ensureZXing();
  if(!ok){
    area.innerHTML = `<p style="color:var(--stamp);font-size:13px;">Knihovnu pro čtení kódů se nepodařilo načíst (potřeba jednorázově internet).</p>`;
    return;
  }
  try{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; });
    const hints = new Map();
    hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, [window.ZXing.BarcodeFormat.QR_CODE, window.ZXing.BarcodeFormat.PDF_417]);
    const reader = new window.ZXing.BrowserMultiFormatReader(hints);
    const result = await reader.decodeFromImageElement(img);
    area.innerHTML = '';
    handleScanResult(result.getText());
  }catch(err){
    console.error(err);
    area.innerHTML = `<p style="color:var(--stamp);font-size:13px;">V fotce se nepodařilo najít čitelný kód. Zkus ostřejší/bližší fotku, nebo zadej let ručně.</p>`;
  }
}

/* -------------------------------- CSV import ------------------------------- */
function downloadSampleCsv(){
  const sample = 'datum,aerolinka,číslo letu,odkud,kam,sedadlo,pnr,poznámka\n2024-06-01,Czech Airlines,OK123,PRG,BCN,14C,ABCDEF,dovolená\n';
  const blob = new Blob([sample], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'moje-lety-sablona.csv';
  a.click();
}
function handleCsvFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    const text = reader.result;
    const delim = detectDelimiter(text);
    const parsed = parseCSV(text, delim);
    if(parsed.length < 2){ showToast('CSV se nepodařilo přečíst.'); return; }
    const headers = parsed[0];
    const rows = parsed.slice(1);
    state.csvRows = {headers, rows};
    state.csvMapping = guessMapping(headers);
    renderAll();
  };
  reader.readAsText(file, 'utf-8');
}
async function confirmCsvImport(){
  const {headers, rows} = state.csvRows;
  const mapping = state.csvMapping;
  let count = 0;
  for(const r of rows){
    const flight = {source:'csv'};
    mapping.forEach((field,i)=>{
      if(field) flight[field] = (r[i]||'').trim();
    });
    if(flight.origin) flight.origin = flight.origin.toUpperCase().slice(0,3);
    if(flight.destination) flight.destination = flight.destination.toUpperCase().slice(0,3);
    if(!flight.date && !flight.origin && !flight.destination) continue;
    await saveFlight(flight);
    count++;
  }
  state.csvRows = null; state.csvMapping = null;
  showToast(`Importováno ${count} letů ✓`);
  state.activeTab = 'flights';
  renderAll();
}

/* ------------------------------ Settings actions ---------------------------- */
function wireSettingsEvents(){
  const sheetsUrlInput = document.getElementById('sheetsUrl');
  if(sheetsUrlInput){
    getSettings().then(cfg=>{ sheetsUrlInput.value = cfg.sheetsUrl || ''; });
    sheetsUrlInput.addEventListener('change', ()=> setSettings({sheetsUrl: sheetsUrlInput.value.trim()}));
  }
  const btnSyncNow = document.getElementById('btnSyncNow');
  if(btnSyncNow) btnSyncNow.addEventListener('click', async ()=>{
    await autoSyncPush();
    await autoSyncPull();
    showToast('Synchronizováno ✓');
  });
  const btnLogout = document.getElementById('btnLogout');
  if(btnLogout) btnLogout.addEventListener('click', async ()=>{
    if(confirm('Odhlásit tohle zařízení? Data v appce tu zůstanou, ale příště se budeš muset znovu přihlásit.')){
      await doLogout();
    }
  });

  const btnExportJson = document.getElementById('btnExportJson');
  if(btnExportJson) btnExportJson.addEventListener('click', async ()=>{
    const flights = await dbGetAll('flights');
    const blob = new Blob([JSON.stringify(flights,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `moje-lety-zaloha-${todayISO()}.json`;
    a.click();
  });
  const btnImportJson = document.getElementById('btnImportJson');
  if(btnImportJson) btnImportJson.addEventListener('click', ()=>document.getElementById('fileImportJson').click());

  const btnExportCsvAll = document.getElementById('btnExportCsvAll');
  if(btnExportCsvAll) btnExportCsvAll.addEventListener('click', async ()=>{
    const flights = await dbGetAll('flights');
    const cols = ['date','airline','flightNumber','origin','destination','depTime','arrTime','seat','pnr','aircraft','notes'];
    const lines = [cols.join(',')];
    for(const f of flights){
      lines.push(cols.map(c=>`"${(f[c]||'').toString().replace(/"/g,'""')}"`).join(','));
    }
    const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `moje-lety-export-${todayISO()}.csv`;
    a.click();
  });

  const btnClearAll = document.getElementById('btnClearAll');
  if(btnClearAll) btnClearAll.addEventListener('click', async ()=>{
    if(confirm('Opravdu smazat úplně všechna data z tohoto zařízení? Nevratné.')){
      const all = await dbGetAll('flights');
      for(const f of all) await dbDelete('flights', f.id);
      await loadFlights();
      showToast('Vymazáno.');
      renderAll();
    }
  });
}
/* --------------------------------- File inputs ------------------------------ */
document.getElementById('fileImportPdf').addEventListener('change', (e)=>{
  const f = e.target.files[0]; if(f) handlePdfFile(f); e.target.value='';
});
document.getElementById('fileImportImage').addEventListener('change', (e)=>{
  const f = e.target.files[0]; if(f) handleScanImageFile(f); e.target.value='';
});
document.getElementById('fileImportCsv').addEventListener('change', (e)=>{
  const f = e.target.files[0]; if(f) handleCsvFile(f); e.target.value='';
});
document.getElementById('fileImportJson').addEventListener('change', (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      let count = 0;
      for(const f of data){ if(f.id){ await dbPut('flights', f); count++; } }
      await loadFlights();
      showToast(`Obnoveno ${count} letů ✓`);
      renderAll();
    }catch(err){ showToast('Soubor se nepodařilo přečíst.'); }
  };
  reader.readAsText(f, 'utf-8');
  e.target.value='';
});

/* ----------------------------------- Init ------------------------------------ */
async function init(){
  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('sw.js'); }catch(e){ /* sandbox nebo file:// – appka funguje i tak */ }
  }
  const cfg = await getSettings();
  if(cfg.sessionToken && await checkSession()){
    state.authed = true;
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = '';
    await loadAirports();
    await loadFlights();
    renderAll();
    autoSyncPull();
  } else {
    state.authed = false;
    renderLockScreen();
    loadAirports(); // databázi letišť si appka může připravit na pozadí i před přihlášením
  }
}
init();
