<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12182B">
<meta name="description" content="Personal flight log and travel collection. Manual entry, PDF and QR import, worldwide airport database. No third-party dependency.">
<title>Flight Log – personal travel diary</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --navy:#12182B;
    --navy-2:#1B2340;
    --navy-3:#232C4E;
    --paper:#F3EDDD;
    --paper-2:#e9e0c8;
    --brass:#D3A94C;
    --brass-dark:#B8923F;
    --teal:#4A9B94;
    --stamp:#C1543A;
    --ink:#1E2233;
    --mist2:#8892B0;
    --line:rgba(255,255,255,.10);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--navy);
    color:#EDEFF7;
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
    background:linear-gradient(180deg, var(--navy-2), var(--navy));
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-sans);
    font-weight:800;
    font-size:19px;
    letter-spacing:.2px;
  }
  .brand svg{ width:22px; height:22px; }
  .sync-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--mist2);
    box-shadow:0 0 0 3px rgba(255,255,255,.06);
  }
  .sync-dot.ok{ background:var(--teal); }
  .sync-dot.busy{ background:var(--brass); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .topbar-right{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--mist2); }

  /* ---------- Main ---------- */
  main{ flex:1; padding:16px 16px 100px; }
  h2.section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--mist2);
    margin:18px 2px 10px;
    font-weight:700;
  }
  .empty{
    text-align:center;
    color:var(--mist2);
    padding:40px 16px;
    border:1px dashed var(--line);
    border-radius:16px;
    font-size:14px;
    line-height:1.5;
  }
  .empty b{ color:#EDEFF7; }

  /* ---------- Sub-tabs (reused: Add tabs, Upcoming/Past) ---------- */
  .subtabs{ display:flex; gap:6px; background:var(--navy-2); padding:4px; border-radius:12px; margin-bottom:16px; }
  .subtab{ flex:1; text-align:center; padding:9px 4px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--mist2); cursor:pointer; }
  .subtab.active{ background:var(--brass); color:#1E1A0A; }

  /* ---------- Flights list + year scrubber (Google Photos style) ---------- */
  .flights-row{ display:flex; gap:8px; align-items:flex-start; }
  .flights-col{ flex:1; min-width:0; }
  .year-scrubber{
    position:sticky; top:70px;
    width:30px; flex:none;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding-top:6px;
  }
  .year-scrubber .yr{
    writing-mode:vertical-rl; text-orientation:mixed;
    font-size:11px; font-family:var(--font-mono); color:var(--mist2);
    cursor:pointer; padding:3px 2px; border-radius:6px;
  }
  .year-scrubber .yr.current{ color:var(--brass); font-weight:800; background:var(--navy-2); }

  .flight-year-group{ margin-bottom:6px; }
  .year-header{
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; user-select:none;
  }
  .year-header .chevron{ transition:transform .18s ease; color:var(--mist2); }
  .year-header.collapsed .chevron{ transform:rotate(-90deg); }
  .year-header:hover h2{ color:#c9cfe6; }

  /* ---------- Ticket / flight card ---------- */
  .flight-card{
    position:relative;
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    display:flex;
    margin-bottom:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.28);
    cursor:pointer;
    overflow:visible;
  }
  .flight-card .fc-photo{
    width:54px; flex:none; border-radius:10px 0 0 10px; overflow:hidden;
    background:var(--paper-2);
  }
  .flight-card .fc-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .flight-card .fc-main{
    flex:1;
    padding:13px 14px;
    min-width:0;
  }
  .fc-route{
    display:flex; align-items:center; gap:6px;
    font-family:var(--font-mono);
    font-weight:700;
    font-size:19px;
    letter-spacing:.3px;
  }
  .fc-route svg{ width:15px; height:15px; flex:none; color:var(--brass-dark); }
  .fc-flag{ font-size:15px; }
  .fc-sub{
    margin-top:4px;
    font-size:12.5px;
    color:#5b5644;
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .fc-airline{ font-weight:600; }
  .flight-card .fc-stub{
    width:64px; flex:none;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:3px;
    padding:6px 2px;
    font-family:var(--font-mono);
    font-size:10.5px;
    text-align:center;
    color:#514c3c;
    border-left:2px dashed rgba(30,34,51,.3);
  }
  .fc-stub .fc-day{ font-size:17px; font-weight:800; color:var(--ink); }
  .flight-card::before, .flight-card::after{
    content:'';
    position:absolute;
    width:14px; height:14px;
    background:var(--navy);
    border-radius:50%;
    right:62px;
  }
  .flight-card::before{ top:-7px; }
  .flight-card::after{ bottom:-7px; }

  .flight-detail{
    background:var(--navy-3);
    border-radius:14px;
    padding:14px;
    margin:-4px 0 14px;
    font-size:13.5px;
    color:var(--mist2);
  }
  .flight-detail .row{ display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--line); gap:10px; }
  .flight-detail .row:last-child{ border-bottom:none; }
  .flight-detail .row span:last-child{ color:#EDEFF7; font-family:var(--font-mono); text-align:right; }
  .detail-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .detail-photo{ width:100%; max-height:220px; object-fit:cover; border-radius:10px; margin-bottom:12px; display:block; }
  .photo-upload-box{
    border:1.5px dashed var(--line); border-radius:10px; padding:14px;
    text-align:center; color:var(--mist2); font-size:12.5px; cursor:pointer; margin-bottom:12px;
  }

  /* ---------- Buttons / forms ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 16px;
    border-radius:11px;
    border:none;
    font-size:14.5px;
    font-weight:700;
    font-family:var(--font-sans);
    cursor:pointer;
    background:var(--navy-3);
    color:#EDEFF7;
    transition:transform .08s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--brass); color:#1E1A0A; }
  .btn-teal{ background:var(--teal); color:#08201E; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); }
  .btn-danger{ background:transparent; color:var(--stamp); border:1px solid rgba(193,84,58,.5); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:9px; }

  label{ display:block; font-size:12.5px; color:var(--mist2); margin:14px 0 6px; font-weight:600; }
  input[type=text], input[type=date], input[type=time], input[type=number], input[type=password], textarea, select{
    width:100%;
    padding:11px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--navy-2);
    color:#EDEFF7;
    font-size:15px;
    font-family:var(--font-sans);
  }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--brass); outline-offset:1px; }
  .field-row{ display:flex; gap:10px; }
  .field-row > div{ flex:1; }
  .autocomplete-wrap{ position:relative; }
  .autocomplete-list{
    position:absolute; left:0; right:0; top:calc(100% + 4px);
    background:var(--navy-2);
    border:1px solid var(--line);
    border-radius:10px;
    max-height:220px; overflow:auto;
    z-index:30;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .autocomplete-item{ padding:10px 12px; font-size:13.5px; border-bottom:1px solid var(--line); cursor:pointer; }
  .autocomplete-item:last-child{ border-bottom:none; }
  .autocomplete-item b{ font-family:var(--font-mono); color:var(--brass); margin-right:6px; }
  .autocomplete-item:hover, .autocomplete-item.active{ background:var(--navy-3); }

  .dropzone{
    border:2px dashed var(--line);
    border-radius:14px;
    padding:28px 16px;
    text-align:center;
    color:var(--mist2);
    font-size:13.5px;
    cursor:pointer;
    margin-bottom:14px;
  }
  .dropzone svg{ width:30px; height:30px; margin-bottom:8px; color:var(--brass); }
  .dropzone b{ color:#EDEFF7; }

  video#scanVideo{ width:100%; border-radius:14px; background:#000; }
  .scan-hint{ font-size:12.5px; color:var(--mist2); text-align:center; margin-top:8px; }

  .review-box{ background:var(--navy-2); border-radius:14px; padding:14px; margin-bottom:14px; border:1px solid var(--line); }
  .review-box .warn{ font-size:12.5px; color:var(--brass); margin-bottom:8px; }
  .raw-toggle{ font-size:12px; color:var(--mist2); text-decoration:underline; cursor:pointer; margin-top:8px; display:inline-block; }
  .raw-text{ font-family:var(--font-mono); font-size:11px; color:var(--mist2); white-space:pre-wrap; word-break:break-all; margin-top:8px; max-height:160px; overflow:auto; }

  table.csv-preview{ width:100%; border-collapse:collapse; font-size:12px; margin-bottom:12px; }
  table.csv-preview th, table.csv-preview td{ border:1px solid var(--line); padding:5px 6px; text-align:left; }
  table.csv-preview select{ padding:4px 6px; font-size:11.5px; }
  .table-scroll{ overflow-x:auto; margin-bottom:12px; }

  /* ---------- Stats ---------- */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .stat-card{ background:var(--navy-2); border-radius:14px; padding:14px; }
  .stat-card .num{ font-family:var(--font-mono); font-size:26px; font-weight:800; color:var(--brass); }
  .stat-card .lbl{ font-size:12px; color:var(--mist2); margin-top:2px; }
  canvas#yearChart{ width:100%; height:160px; background:var(--navy-2); border-radius:14px; }
  .chip-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{ background:var(--navy-2); border-radius:20px; padding:5px 11px; font-size:12px; font-family:var(--font-mono); }
  .chip.toggle{ cursor:pointer; border:1px solid var(--line); user-select:none; }
  .chip.toggle.active{ background:var(--brass); color:#1E1A0A; border-color:var(--brass); font-weight:700; }

  .map-wrap{ background:var(--navy-2); border-radius:14px; padding:10px; margin-bottom:10px; }
  .map-wrap svg{ width:100%; height:auto; display:block; }
  .map-country{ fill:#283056; stroke:#354073; stroke-width:.4; }
  .map-arc{ fill:none; stroke:var(--brass); stroke-width:.7; opacity:.75; }
  .map-dot{ fill:var(--teal); stroke:var(--navy-2); stroke-width:.4; }

  /* ---------- Settings ---------- */
  .settings-block{ background:var(--navy-2); border-radius:14px; padding:14px; margin-bottom:16px; }
  .settings-block p{ font-size:13px; color:var(--mist2); line-height:1.5; margin:4px 0 0; }
  .settings-block h3{ font-size:14.5px; margin:0 0 4px; }
  .toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%);
    background:var(--brass); color:#1E1A0A; padding:10px 18px; border-radius:30px;
    font-size:13.5px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.4);
    z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  /* ---------- Tab bar ---------- */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0;
    max-width:560px; margin:0 auto;
    display:flex;
    background:linear-gradient(0deg, var(--navy) 60%, rgba(18,24,43,.97));
    border-top:1px solid var(--line);
    padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
    z-index:20;
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--mist2); font-size:10.5px; font-weight:700; padding:6px 2px; border-radius:10px;
    cursor:pointer;
  }
  .tab-btn svg{ width:21px; height:21px; }
  .tab-btn.active{ color:var(--brass); }
  @media (min-width:560px){ #app{ border-left:1px solid var(--line); border-right:1px solid var(--line); } }

  /* ---------- Lock screen (password + email 2FA) ---------- */
  #lockScreen{
    position:fixed; inset:0; z-index:200;
    background:radial-gradient(120% 100% at 50% 0%, var(--navy-2), var(--navy) 70%);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .lock-card{
    width:100%; max-width:380px;
    background:var(--paper); color:var(--ink);
    border-radius:18px; padding:26px 22px;
    box-shadow:0 10px 40px rgba(0,0,0,.45);
  }
  .lock-card .lock-icon{ width:40px; height:40px; color:var(--brass-dark); margin-bottom:10px; }
  .lock-card h2{ margin:0 0 4px; font-size:20px; }
  .lock-card p.lock-sub{ margin:0 0 18px; font-size:13px; color:#5b5644; line-height:1.5; }
  .lock-card label{ color:#5b5644; }
  .lock-card input{ background:#fff; border:1px solid rgba(30,34,51,.2); color:var(--ink); }
  .lock-error{ color:var(--stamp); font-size:13px; margin-top:10px; font-weight:600; }
  .lock-code-input{ letter-spacing:6px; font-family:var(--font-mono); font-size:22px; text-align:center; }
  .lock-server-toggle{ font-size:12px; color:#8a836a; text-decoration:underline; cursor:pointer; margin-top:16px; display:inline-block; }
  .lock-server-box{ margin-top:10px; }
  .lock-resend{ font-size:12.5px; color:var(--teal); text-decoration:underline; cursor:pointer; margin-top:10px; display:inline-block; }
</style>
</head>
<body>
<div id="lockScreen" style="display:none"></div>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M2 16l20-7-7 7 2 6-4-3-3 3-1-5-7-1z" fill="currentColor" style="color:var(--brass)"/></svg>
      Flight Log
    </div>
    <div class="topbar-right">
      <span id="syncLabel">local</span>
      <span class="sync-dot" id="syncDot"></span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<input type="file" id="fileImportPdf" accept="application/pdf" style="display:none">
<input type="file" id="fileImportImage" accept="image/*" style="display:none">
<input type="file" id="fileImportCsv" accept=".csv,text/csv,text/plain" style="display:none">
<input type="file" id="fileImportJson" accept="application/json,.json" style="display:none">
<input type="file" id="fileImportPhoto" accept="image/*" style="display:none">
<script>
/* =========================================================================
   FLIGHT LOG — personal flight diary (PWA)
   Standalone implementation. No data leaves the device unless you enable
   your own Google Sheets backup (Settings).
   ========================================================================= */

/* ---------------------------- IndexedDB layer --------------------------- */
const DB_NAME = 'flightlog-db';
const DB_VERSION = 2;
let _dbPromise = null;
function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('flights')) db.createObjectStore('flights', {keyPath:'id'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', {keyPath:'key'});
      if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', {keyPath:'flightId'});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _dbPromise;
}
function dbGetAll(store){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const r = tx.objectStore(store).getAll();
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  }));
}
function dbGet(store,key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const r = tx.objectStore(store).get(key);
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  }));
}
function dbPut(store,value){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  }));
}
function dbDelete(store,key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  }));
}

/* ------------------------------- Utilities ------------------------------ */
function uuid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function julianToISODate(julianDay, year){
  const d = new Date(Date.UTC(year,0,1));
  d.setUTCDate(d.getUTCDate() + (julianDay-1));
  return d.toISOString().slice(0,10);
}
const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDateHuman(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  const mi = parseInt(m,10)-1;
  if(mi<0||mi>11||!d) return iso;
  return `${MONTHS_EN[mi]} ${parseInt(d,10)}, ${y}`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
/* Always store `date` as a plain LOCAL calendar date (YYYY-MM-DD), never a
   UTC datetime — otherwise the day can shift by one depending on the
   device's timezone (e.g. a spreadsheet exporting "2026-08-29" as a UTC
   timestamp can arrive here as "...-08-28T22:00:00.000Z"). Departure/
   arrival times are untouched — those stay local-airport-time strings. */
function normalizeDateInput(raw){
  if(!raw) return '';
  raw = String(raw).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw; // already a clean date
  const d = new Date(raw);
  if(!isNaN(d.getTime())){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  return raw; // unparseable — leave as-is rather than lose data
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function countryFlag(cc){
  if(!cc || cc.length !== 2) return '';
  const upper = cc.toUpperCase();
  if(!/^[A-Z]{2}$/.test(upper)) return '';
  const codePoints = [...upper].map(c => 127397 + c.charCodeAt(0));
  return String.fromCodePoint(...codePoints);
}

/* CSV parsing (handles quoted fields, auto ',' or ';' delimiter) */
function detectDelimiter(text){
  const line = text.split(/\r?\n/)[0] || '';
  const commas = (line.match(/,/g)||[]).length;
  const semis = (line.match(/;/g)||[]).length;
  return semis > commas ? ';' : ',';
}
function parseCSV(text, delim){
  const rows = []; let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ field+='"'; i++; } else inQ=false; }
      else field += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === delim){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => (f||'').trim() !== ''));
}

let AIRPORTS = [];
let AIRPORT_BY_IATA = new Map();
async function loadAirports(){
  try{
    const res = await fetch('airports.json');
    AIRPORTS = await res.json();
    AIRPORT_BY_IATA = new Map(AIRPORTS.map(a=>[a.iata, a]));
  }catch(e){
    console.error('Could not load the airport database', e);
  }
}
function searchAirports(query, limit=8){
  query = (query||'').trim().toUpperCase();
  if(!query) return [];
  const exact = AIRPORT_BY_IATA.get(query);
  const out = [];
  if(exact) out.push(exact);
  for(const a of AIRPORTS){
    if(out.length >= limit) break;
    if(a.iata === query) continue;
    if(a.iata.startsWith(query) || a.city.toUpperCase().startsWith(query) || a.name.toUpperCase().includes(query) || a.city.toUpperCase().includes(query)){
      out.push(a);
    }
  }
  return out.slice(0, limit);
}

async function resizeImageToDataUrl(file, maxDim=1280, quality=0.82){
  const dataUrl = await new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
  const img = new Image();
  img.src = dataUrl;
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; });
  let {width, height} = img;
  if(width > maxDim || height > maxDim){
    const scale = maxDim / Math.max(width, height);
    width = Math.round(width*scale); height = Math.round(height*scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', quality);
}

/* ------------------------------ Sign in (2FA) --------------------------- */
async function serverUrl(){
  const cfg = await getSettings();
  return cfg.sheetsUrl || '';
}
async function callServer(payload, method){
  const url = await serverUrl();
  if(!url) return {error:'no_server'};
  try{
    let res;
    if(method === 'GET'){
      const full = url + (url.includes('?')?'&':'?') + payload;
      res = await fetch(full);
    } else {
      res = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(payload),
      });
    }
    let data;
    try{ data = await res.json(); }
    catch(parseErr){ return {error:'bad_response', httpStatus: res.status}; }
    return data;
  }catch(err){
    console.error(err);
    return {error:'network'};
  }
}
function describeServerError(res){
  if(!res) return 'Unknown error.';
  switch(res.error){
    case undefined: return '';
    case 'no_server': return 'Set the server address below first.';
    case 'network': return 'The server is not responding. Check your internet connection and that the app is running from a web address (not just double-clicked as a file).';
    case 'bad_response': return 'The server returned an unexpected response (status '+(res.httpStatus||'?')+'). Check that you deployed a NEW version in Apps Script (Deploy → Manage deployments → pencil → New version).';
    case 'invalid_credentials': return 'Password does not match the one stored in Script Properties (AUTH_PASSWORD) — or that property is still missing.';
    case 'invalid_json': return 'The app sent data the server could not understand. Please try again.';
    case 'unauthorized': return 'The server is running an old version of the code (does not recognise sign-in). Check that you saved and deployed a NEW version of Code.gs.';
    case 'unknown_action': return 'The server is running an old version of the code. Deploy a NEW version of Code.gs.';
    default: return 'Server error: ' + res.error;
  }
}
async function checkSession(){
  const cfg = await getSettings();
  if(!cfg.sheetsUrl || !cfg.sessionToken) return false;
  const data = await callServer('action=check&key='+encodeURIComponent(cfg.sessionToken), 'GET');
  return !!data.ok;
}
async function requestLoginCode(password){
  return await callServer({action:'login_request', email: AUTH_EMAIL, password});
}
async function verifyLoginCode(code){
  const data = await callServer({action:'login_verify', code});
  if(data.ok && data.token){
    await setSettings({sessionToken: data.token});
  }
  return data;
}
async function doLogout(){
  const cfg = await getSettings();
  if(cfg.sessionToken) await callServer({action:'logout', token: cfg.sessionToken});
  await setSettings({sessionToken: ''});
  state.authed = false;
  state.lockStage = 'password';
  renderLockScreen();
}

/* Silent auto-sync: pulls on start, pushes after every change */
let autoSyncTimer = null;
function scheduleAutoSync(){
  clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(autoSyncPush, 900);
}
async function autoSyncPush(){
  const cfg = await getSettings();
  if(!cfg.sheetsUrl || !cfg.sessionToken) return;
  const dot = document.getElementById('syncDot');
  if(dot) dot.className = 'sync-dot busy';
  const flights = await dbGetAll('flights');
  const data = await callServer({action:'sync', key: cfg.sessionToken, flights});
  if(dot) dot.className = data.ok ? 'sync-dot ok' : 'sync-dot';
  const lbl = document.getElementById('syncLabel');
  if(lbl && data.ok) lbl.textContent = 'backed up';
}
async function autoSyncPull(){
  const cfg = await getSettings();
  if(!cfg.sheetsUrl || !cfg.sessionToken) return;
  const dot = document.getElementById('syncDot');
  if(dot) dot.className = 'sync-dot busy';
  const data = await callServer('action=flights&key='+encodeURIComponent(cfg.sessionToken), 'GET');
  if(data.error){ if(dot) dot.className='sync-dot'; return; }
  let changed = false;
  for(const remote of (data.flights||[])){
    if(!remote.id) continue;
    const local = state.flights.find(f=>f.id===remote.id);
    const remoteUpdated = Number(remote.updatedAt)||0;
    const localUpdated = local ? (Number(local.updatedAt)||0) : -1;
    if(!local || remoteUpdated > localUpdated){
      await dbPut('flights', remote);
      changed = true;
    }
  }
  if(changed) await loadFlights();
  if(dot) dot.className = 'sync-dot ok';
  const lbl = document.getElementById('syncLabel');
  if(lbl) lbl.textContent = 'synced';
  if(changed && state.activeTab !== 'add') renderAll();
}

const LOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" class="lock-icon"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
function renderLockScreen(){
  const el = document.getElementById('lockScreen');
  if(state.authed){ el.style.display='none'; return; }

      </div>
    </div>`;
  } else {
    el.innerHTML = `
    <div class="lock-card">
      ${LOCK_ICON}
      <h2>Enter the code from your email</h2>
      <p class="lock-sub">We sent a six-digit code to ${escapeHtml(AUTH_EMAIL)}. Valid for 10 minutes.</p>
      <form id="lockCodeForm">
        <label>Code</label>
        <input type="text" id="lockCode" class="lock-code-input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required autofocus>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:16px;" ${state.lockBusy?'disabled':''}>${state.lockBusy?'Verifying…':'Sign in'}</button>
      </form>
      ${state.lockError?`<div class="lock-error">${escapeHtml(state.lockError)}</div>`:''}
      <span class="lock-resend" id="lockResend">resend code</span>
    </div>`;
  }
  wireLockScreen();
}
function wireLockScreen(){
  const pwForm = document.getElementById('lockPasswordForm');
  if(pwForm){
    pwForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const pw = document.getElementById('lockPassword').value;
      state.lockBusy = true; state.lockError=''; renderLockScreen();
      const url = await serverUrl();
      if(!url){
        state.lockBusy=false; state.lockError='Set the server address below first.'; renderLockScreen(); return;
      }
      const res = await requestLoginCode(pw);
      state.lockBusy = false;
      if(res.ok){ state.lockStage='code'; state.lockError=''; }
      else state.lockError = describeServerError(res);
      renderLockScreen();
    });
  }
  const codeForm = document.getElementById('lockCodeForm');
  if(codeForm){
    codeForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const code = document.getElementById('lockCode').value.trim();
      state.lockBusy = true; state.lockError=''; renderLockScreen();
      const res = await verifyLoginCode(code);
      state.lockBusy = false;
      if(res.ok){
        state.authed = true;
        document.getElementById('app').style.display = '';
        document.getElementById('lockScreen').style.display = 'none';
        await loadAirports();
        await loadFlights();
        if(await migrateFlightDates()){ await loadFlights(); scheduleAutoSync(); }
        renderAll();
        autoSyncPull();
      } else {
        state.lockError = res.error === 'invalid_code' ? 'Invalid or expired code.' : describeServerError(res);
        renderLockScreen();
      }
    });
    const resend = document.getElementById('lockResend');
    if(resend) resend.addEventListener('click', ()=>{ state.lockStage='password'; state.lockError=''; renderLockScreen(); });
  }
  const toggle = document.getElementById('lockServerToggle');
  if(toggle){
    toggle.addEventListener('click', async ()=>{
      const box = document.getElementById('lockServerBox');
      box.style.display = box.style.display==='none' ? 'block' : 'none';
      document.getElementById('lockServerUrl').value = await serverUrl();
    });
  }
  const saveServerBtn = document.getElementById('lockServerSave');
  if(saveServerBtn){
    saveServerBtn.addEventListener('click', async ()=>{
      const val = document.getElementById('lockServerUrl').value.trim();
      await setSettings({sheetsUrl: val});
      showToast('Address saved.');
    });
  }
}

    <div class="field-row">
      <div class="autocomplete-wrap">
        <label>From (IATA)</label>
        <input type="text" name="origin" id="originInput" value="${f.origin||''}" placeholder="e.g. PRG" maxlength="3" autocomplete="off" required>
        <div class="autocomplete-list" id="originList" style="display:none"></div>
      </div>
      <div class="autocomplete-wrap">
        <label>To (IATA)</label>
        <input type="text" name="destination" id="destInput" value="${f.destination||''}" placeholder="e.g. BCN" maxlength="3" autocomplete="off" required>
        <div class="autocomplete-list" id="destList" style="display:none"></div>
      </div>
    </div>
    <label>Flight number (e.g. OK123)</label>
    <input type="text" name="flightNumber" value="${escapeHtml(f.flightNumber||'')}" placeholder="OK123">
    <div class="field-row">
      <div><label>Departure</label><input type="time" name="depTime" value="${f.depTime||''}"></div>
      <div><label>Arrival</label><input type="time" name="arrTime" value="${f.arrTime||''}"></div>
    </div>
    <div class="field-row">
      <div><label>Seat</label><input type="text" name="seat" value="${escapeHtml(f.seat||'')}" placeholder="12A"></div>
      <div><label>Booking reference</label><input type="text" name="pnr" value="${escapeHtml(f.pnr||'')}" placeholder="PNR"></div>
    </div>
    <label>Aircraft type</label>
    <input type="text" name="aircraft" value="${escapeHtml(f.aircraft||'')}" placeholder="e.g. A320">
    <label>Notes</label>
    <textarea name="notes" rows="2">${escapeHtml(f.notes||'')}</textarea>
    <button type="submit" class="btn btn-primary btn-block" style="margin-top:18px;">${f.id?'Save changes':'Save flight'}</button>
    ${f.id?`<input type="hidden" name="id" value="${f.id}">`:''}
  </form>`;
}

function pdfImportHTML(){
  return `
  <div class="dropzone" id="pdfDropzone">
    ${ICONS.upload}<br>
    <b>Upload a PDF</b><br>boarding pass or itinerary (tap to choose a file)
  </div>
  <p style="font-size:12.5px;color:var(--mist2);line-height:1.5;">
    We'll try to pull out the date, airports and flight number automatically. Airline formats vary a lot,
    so you'll always see a suggestion to <b>review and complete</b> before saving — nothing is saved blindly.
  </p>
  <div id="pdfResult"></div>
  `;
}
function scanImportHTML(){
  return `
  <div class="dropzone" id="scanDropzoneCamera">
    ${ICONS.camera}<br><b>Scan with camera</b><br>QR or barcode (PDF417) from a boarding pass
  </div>
  <div class="dropzone" id="scanDropzoneImage">
    ${ICONS.upload}<br><b>Upload a photo of the code</b><br>if you can't use the camera
  </div>
  <p style="font-size:12.5px;color:var(--mist2);line-height:1.5;">
    Boarding passes use the IATA BCBP standard, which <b>does not include the year</b> of the flight (just
    the day of the year) — so after scanning we'll ask you to confirm the year.
  </p>
  <div id="scanArea"></div>
  <div id="scanResult"></div>
  `;
}
function csvImportHTML(){
  if(state.csvRows){
    return csvPreviewHTML();
  }
  return `
  <div class="dropzone" id="csvDropzone">
    ${ICONS.upload}<br><b>Upload a CSV</b><br>bulk-import your historical flights
  </div>
  <p style="font-size:12.5px;color:var(--mist2);line-height:1.5;">
    This is the most reliable way to get older flights in all at once. Put together a spreadsheet
    (columns in any order or language) with things like: date, airline/flight number,
    from, to, seat, PNR, notes — after upload you'll match up the columns yourself,
    and nothing is saved until you've seen a preview.
  </p>
  <button class="btn btn-ghost btn-block" id="csvSampleBtn">Download a sample CSV template</button>
  `;
}

const CSV_FIELD_OPTIONS = [
  {v:'', l:'— ignore —'},
  {v:'date', l:'Date'},
  {v:'airline', l:'Airline'},
  {v:'flightNumber', l:'Flight number'},
  {v:'origin', l:'From (IATA)'},
  {v:'destination', l:'To (IATA)'},
  {v:'depTime', l:'Departure time'},
  {v:'arrTime', l:'Arrival time'},
  {v:'seat', l:'Seat'},
  {v:'pnr', l:'Booking reference'},
  {v:'aircraft', l:'Aircraft'},
  {v:'notes', l:'Notes'},
];
const HEADER_ALIASES = {
  date:['date','datum','den'],
  airline:['airline','aerolinka','dopravce','carrier'],
  flightNumber:['flight','flightnumber','flight_number','let','cislo letu','číslo letu','cislo_letu'],
  origin:['from','origin','odkud','z','departure','odlet'],
  destination:['to','destination','kam','do','arrival','prilet','přílet'],
  depTime:['deptime','dep_time','cas odletu','čas odletu'],
  arrTime:['arrtime','arr_time','cas priletu','čas příletu'],
  seat:['seat','sedadlo'],
  pnr:['pnr','rezervace','booking','kod','kód'],
  aircraft:['aircraft','letadlo','typ letadla','plane'],
  notes:['notes','poznamka','poznámka','note'],
};
function guessMapping(headers){
  return headers.map(h=>{
    const norm = h.trim().toLowerCase();
    for(const [field, aliases] of Object.entries(HEADER_ALIASES)){
      if(aliases.includes(norm)) return field;
    }
    return '';
  });
}
function csvPreviewHTML(){
  const {headers, rows} = state.csvRows;
  const mapping = state.csvMapping;
  return `
  <div class="review-box">
    <div class="warn">Check the column matching, then confirm the import (${rows.length} rows).</div>
    <div class="table-scroll">
    <table class="csv-preview">
      <thead><tr>${headers.map((h,i)=>`<th>
        ${escapeHtml(h)}<br>
        <select data-col="${i}" class="csvMapSelect">
          ${CSV_FIELD_OPTIONS.map(o=>`<option value="${o.v}" ${mapping[i]===o.v?'selected':''}>${o.l}</option>`).join('')}
        </select>
      </th>`).join('')}</tr></thead>
      <tbody>
        ${rows.slice(0,6).map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}
      </tbody>
    </table>
    </div>
    ${rows.length>6?`<p style="font-size:12px;color:var(--mist2);">…and ${rows.length-6} more rows.</p>`:''}
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" id="csvConfirmBtn">Import ${rows.length} flights</button>
      <button class="btn btn-ghost" id="csvCancelBtn">Cancel</button>
    </div>
  </div>`;
}

function projectPoint(lon, lat){ return [lon + 180, 90 - lat]; }

function flightsForStats(){
  if(state.statsYears === null) return state.flights;
  return state.flights.filter(f => state.statsYears.has((f.date||'').slice(0,4)));
}
function computeStats(fl){
  const airportsSet = new Set();
  const countrySet = new Set();
  const airlineCounts = {};
  const yearCounts = {};
  let totalKm = 0, validDistLegs = 0;
  for(const f of fl){
    if(f.origin) airportsSet.add(f.origin);
    if(f.destination) airportsSet.add(f.destination);
    const o = AIRPORT_BY_IATA.get(f.origin), d = AIRPORT_BY_IATA.get(f.destination);
    if(o) countrySet.add(o.country);
    if(d) countrySet.add(d.country);
    if(o && d){ totalKm += haversineKm(o.lat,o.lon,d.lat,d.lon); validDistLegs++; }
    const carrier = (f.flightNumber||'').replace(/[0-9\s]/g,'').slice(0,2) || (f.airline||'').slice(0,2);
    if(carrier) airlineCounts[carrier] = (airlineCounts[carrier]||0)+1;
    const y = (f.date||'').slice(0,4);
    if(y) yearCounts[y] = (yearCounts[y]||0)+1;
  }
  const totalHours = totalKm / 800 + validDistLegs*0.5; // rough estimate: 800 km/h cruise + 30 min overhead per leg
  const topAirlines = Object.entries(airlineCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return {
    total: fl.length,
    airports: airportsSet.size,
    countries: countrySet.size,
    totalKm: Math.round(totalKm),
    totalHours: Math.round(totalHours*10)/10,
    yearCounts, topAirlines,
  };
}
function renderStatsView(){
  if(!state.flights.length){
    return `<div class="empty">Stats will show up once you've added your first flight.</div>`;
  }
  const allYears = [...new Set(state.flights.map(f=>(f.date||'').slice(0,4)).filter(Boolean))].sort((a,b)=>b.localeCompare(a));
  const filtered = flightsForStats();
  const s = computeStats(filtered);
  const allSelected = state.statsYears === null;

  const yearChips = `
  <div class="chip-list" style="margin-bottom:16px;">
    <div class="chip toggle ${allSelected?'active':''}" data-statsyear="__all__">All</div>
    ${allYears.map(y=>`<div class="chip toggle ${allSelected || state.statsYears.has(y) ? 'active':''}" data-statsyear="${y}">${y}</div>`).join('')}
  </div>`;

  return `
  ${yearChips}
  <div class="stat-grid">
    <div class="stat-card"><div class="num">${s.total}</div><div class="lbl">flights</div></div>
    <div class="stat-card"><div class="num">${s.airports}</div><div class="lbl">airports visited</div></div>
    <div class="stat-card"><div class="num">${s.countries}</div><div class="lbl">countries</div></div>
    <div class="stat-card"><div class="num">${s.totalKm.toLocaleString('en-US')}</div><div class="lbl">km flown</div></div>
  </div>
  <h2 class="section-title">Your routes</h2>
  ${renderWorldMap(filtered)}
  <h2 class="section-title">Estimated time in the air</h2>
  <div class="stat-card" style="margin-bottom:18px;"><div class="num">${s.totalHours} h</div><div class="lbl">rough estimate (typical cruise speed)</div></div>
  <h2 class="section-title">Flights per year</h2>
  <canvas id="yearChart"></canvas>
  <h2 class="section-title">Most frequent airlines</h2>
  <div class="chip-list">
    ${s.topAirlines.map(([c,n])=>`<div class="chip">${escapeHtml(c)} · ${n}×</div>`).join('') || '<span style="color:var(--mist2);font-size:13px;">not enough data</span>'}
  </div>
  `;
}
function renderWorldMap(fl){
  const routeMap = new Map();
  const airportPts = new Map();
  for(const f of fl){
    const o = AIRPORT_BY_IATA.get(f.origin), d = AIRPORT_BY_IATA.get(f.destination);
    if(!o || !d) continue;
    airportPts.set(o.iata, o); airportPts.set(d.iata, d);
    const key = [o.iata, d.iata].sort().join('-');
    const cur = routeMap.get(key);
    routeMap.set(key, {o, d, count: (cur?cur.count:0)+1});
  }
  if(!routeMap.size){
    return `<div class="map-wrap" style="text-align:center;color:var(--mist2);font-size:13px;padding:30px 10px;">No routes for this selection yet.</div>`;
  }
  const arcs = [...routeMap.values()].map(({o,d})=>{
    const [x1,y1] = projectPoint(o.lon, o.lat);
    const [x2,y2] = projectPoint(d.lon, d.lat);
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    const dist = Math.hypot(x2-x1, y2-y1);
    const curveY = my - Math.min(dist*0.25, 26);
    return `<path class="map-arc" d="M${x1.toFixed(1)},${y1.toFixed(1)} Q${mx.toFixed(1)},${curveY.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}"><title>${escapeHtml(o.iata)} → ${escapeHtml(d.iata)}</title></path>`;
  }).join('');
  const dots = [...airportPts.values()].map(a=>{
    const [x,y] = projectPoint(a.lon, a.lat);
    return `<circle class="map-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.4"><title>${escapeHtml(countryFlag(a.country))} ${escapeHtml(a.iata)} · ${escapeHtml(a.city)}</title></circle>`;
  }).join('');
  return `<div class="map-wrap"><svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <path class="map-country" fill-rule="evenodd" d="${WORLD_MAP_PATH}"/>
    ${arcs}
    ${dots}
  </svg></div>`;
}
function drawYearChart(){
  const canvas = document.getElementById('yearChart');
  if(!canvas) return;
  const s = computeStats(flightsForStats());
  const years = Object.keys(s.yearCounts).sort();
  if(!years.length) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = 160 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const w = rect.width, h = 160;
  ctx.clearRect(0,0,w,h);
  const max = Math.max(...years.map(y=>s.yearCounts[y]));
  const barW = Math.min(40, (w-20) / years.length - 10);
  const gap = (w - barW*years.length) / (years.length+1);
  ctx.font = '11px -apple-system, sans-serif';
  years.forEach((y,i)=>{
    const val = s.yearCounts[y];
    const bh = (val/max) * (h-40);
    const x = gap + i*(barW+gap);
    const yTop = h - 24 - bh;
    ctx.fillStyle = '#D3A94C';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, yTop, barW, bh, 4) : ctx.rect(x, yTop, barW, bh);
    ctx.fill();
    ctx.fillStyle = '#EDEFF7';
    ctx.textAlign = 'center';
    ctx.fillText(val, x+barW/2, yTop-6);
    ctx.fillStyle = '#8892B0';
    ctx.fillText(y, x+barW/2, h-8);
  });
}

function wireAutocomplete(inputId, listId, onPick){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if(!input) return;
  input.addEventListener('input', ()=>{
    const q = input.value;
    const results = searchAirports(q, 8);
    if(!results.length){ list.style.display='none'; return; }
    list.innerHTML = results.map(a=>`<div class="autocomplete-item" data-iata="${a.iata}"><b>${a.iata}</b>${countryFlag(a.country)} ${escapeHtml(a.city)} — ${escapeHtml(a.name)}</div>`).join('');
    list.style.display = 'block';
    list.querySelectorAll('.autocomplete-item').forEach(it=>{
      it.addEventListener('click', ()=>{
        input.value = it.dataset.iata;
        list.style.display = 'none';
        if(onPick) onPick(it.dataset.iata);
      });
    });
  });
  input.addEventListener('blur', ()=> setTimeout(()=>{ list.style.display='none'; }, 150));
}

/* -------------------------------- PDF import ------------------------------- */
let pdfjsReady = false;
function ensurePdfJs(){
  if(pdfjsReady) return Promise.resolve(true);
  return new Promise((resolve)=>{
    if(window.pdfjsLib){ pdfjsReady = true; resolve(true); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      pdfjsReady = true; resolve(true);
    };
    s.onerror = ()=> resolve(false);
    document.head.appendChild(s);
  });
}
async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data: buf}).promise;
  let text = '';
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return text;
}
const MONTH_ABBR = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
function guessFlightFromText(text){
  const upper = text.toUpperCase();
  const codeMatches = [...upper.matchAll(/\b[A-Z]{3}\b/g)].map(m=>m[0]);
  const validCodes = [];
  for(const c of codeMatches){
    if(AIRPORT_BY_IATA.has(c) && !validCodes.includes(c)) validCodes.push(c);
    if(validCodes.length >= 6) break;
  }
  let flightNumber = '';
  const fm = upper.match(/\b([A-Z]{2}|[0-9][A-Z]|[A-Z][0-9])\s?(\d{1,4})\b/);
  if(fm) flightNumber = fm[1].trim() + fm[2].trim();
  let date = '';
  let dm = upper.match(/\b(\d{1,2})\s?(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\s?(\d{2,4})\b/);
  if(dm){
    let yr = dm[3].length===2 ? (2000+parseInt(dm[3],10)) : parseInt(dm[3],10);
    date = `${yr}-${String(MONTH_ABBR[dm[2]]).padStart(2,'0')}-${String(parseInt(dm[1],10)).padStart(2,'0')}`;
  } else {
    dm = upper.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);
    if(dm) date = `${dm[1]}-${dm[2]}-${dm[3]}`;
    else {
      dm = upper.match(/\b(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})\b/);
      if(dm){
        let yr = dm[3].length===2 ? (2000+parseInt(dm[3],10)) : parseInt(dm[3],10);
        date = `${yr}-${String(parseInt(dm[2],10)).padStart(2,'0')}-${String(parseInt(dm[1],10)).padStart(2,'0')}`;
      }
    }
  }
  let pnr = '';
  const pm = text.match(/(?:PNR|Booking reference|Rezervačn[íi] k[óo]d|Reservation code)[:\s]*([A-Z0-9]{5,8})/i);
  if(pm) pnr = pm[1];
  return { origin: validCodes[0]||'', destination: validCodes[1]||'', flightNumber, date, pnr };
}

  document.getElementById('pdfResult').innerHTML = `<p style="color:var(--mist2);font-size:13px;">Reading the PDF…</p>`;

  }
}

function parseBCBP(raw){
  if(!raw || raw[0] !== 'M') return null;
  try{
    const legs = parseInt(raw[1],10) || 1;
    const name = raw.slice(2,22).trim();
    const pnr = raw.slice(23,30).trim();
    const from = raw.slice(30,33).trim();
    const to = raw.slice(33,36).trim();
    const carrier = raw.slice(36,39).trim();
    const flightNumRaw = raw.slice(39,44).trim().replace(/^0+/,'');
    const julianStr = raw.slice(44,47).trim();
    const julianDay = parseInt(julianStr,10);
    const compartment = raw.slice(47,48).trim();
    const seat = raw.slice(48,52).trim();
    const sequence = raw.slice(52,57).trim();
    const [lastName,firstName] = name.split('/');
    if(!from || !to || isNaN(julianDay)) return null;
    return { legs, lastName:lastName||'', firstName:firstName||'', pnr, from, to, carrier,
      flightNumber: (carrier+flightNumRaw).trim(), julianDay, compartment, seat, sequence, raw };
  }catch(e){ return null; }
}
function bcbpToDraft(parsed, year){
  return {
    date: julianToISODate(parsed.julianDay, year),
    origin: parsed.from, destination: parsed.to,
    flightNumber: parsed.flightNumber, seat: parsed.seat, pnr: parsed.pnr,
  };
}

async function startCameraScan(){
  const area = document.getElementById('scanArea');
  const ok = await ensureZXing();
  if(!ok){
    area.innerHTML = `<p style="color:var(--stamp);font-size:13px;">Could not load the code-reading library (needs internet once).</p>`;
    return;
  }
  area.innerHTML = `<video id="scanVideo" playsinline muted></video><div class="scan-hint">Point the camera at a QR/barcode. Scanning stops automatically once a code is found.</div><button class="btn btn-ghost btn-block" id="stopScanBtn" style="margin-top:10px;">Stop</button>`;
  try{
    const hints = new Map();
    hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, [window.ZXing.BarcodeFormat.QR_CODE, window.ZXing.BarcodeFormat.PDF_417]);
    const reader = new window.ZXing.BrowserMultiFormatReader(hints);
    const devices = await window.ZXing.BrowserMultiFormatReader.listVideoInputDevices();
    const backCam = devices.find(d=>/back|rear|environment/i.test(d.label)) || devices[devices.length-1];
    const controls = await reader.decodeFromVideoDevice(backCam ? backCam.deviceId : undefined, 'scanVideo', (result, err)=>{
      if(result){
        controls.stop();
        state.scanControls = null;
        handleScanResult(result.getText());
      }
    });
    state.scanControls = controls;
    document.getElementById('stopScanBtn').addEventListener('click', ()=>{
      controls.stop(); state.scanControls=null; area.innerHTML='';
    });
  }catch(err){
    console.error(err);
    area.innerHTML = `<p style="color:var(--stamp);font-size:13px;">Could not start the camera (needs HTTPS and camera permission). Try uploading a photo of the code instead.</p>`;
  }
}
async function handleScanImageFile(file){
  const area = document.getElementById('scanArea');
  area.innerHTML = `<p style="color:var(--mist2);font-size:13px;">Analysing photo…</p>`;
  const ok = await ensureZXing();
  if(!ok){
    area.innerHTML = `<p style="color:var(--stamp);font-size:13px;">Could not load the code-reading library (needs internet once).</p>`;
    return;
  }
  try{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; });
    const hints = new Map();
    hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, [window.ZXing.BarcodeFormat.QR_CODE, window.ZXing.BarcodeFormat.PDF_417]);
    const reader = new window.ZXing.BrowserMultiFormatReader(hints);
    const result = await reader.decodeFromImageElement(img);
    area.innerHTML = '';
    handleScanResult(result.getText());
  }catch(err){
    console.error(err);
    area.innerHTML = `<p style="color:var(--stamp);font-size:13px;">Could not find a readable code in that photo. Try a sharper/closer photo, or add the flight manually.</p>`;
  }
}

  a.click();
}
function handleCsvFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    const text = reader.result;
    const delim = detectDelimiter(text);
    const parsed = parseCSV(text, delim);
    if(parsed.length < 2){ showToast('Could not read this CSV.'); return; }
    const headers = parsed[0];
    const rows = parsed.slice(1);
    state.csvRows = {headers, rows};
    state.csvMapping = guessMapping(headers);
    renderAll();
  };
  reader.readAsText(file, 'utf-8');
}
async function confirmCsvImport(){
  const {headers, rows} = state.csvRows;
  const mapping = state.csvMapping;
  let count = 0;
  for(const r of rows){
    const flight = {source:'csv'};
    mapping.forEach((field,i)=>{
      if(field) flight[field] = (r[i]||'').trim();
    });
    if(flight.origin) flight.origin = flight.origin.toUpperCase().slice(0,3);
    if(flight.destination) flight.destination = flight.destination.toUpperCase().slice(0,3);
    if(!flight.date && !flight.origin && !flight.destination) continue;
    await saveFlight(flight);
    count++;
  }
  state.csvRows = null; state.csvMapping = null;
  showToast(`Imported ${count} flights ✓`);
  state.activeTab = 'flights';
  renderAll();
}

/* ------------------------------ Settings actions ---------------------------- */
function wireSettingsEvents(){
  const btnPush = document.getElementById('btnSyncNow');
  const sheetsUrlInput = document.getElementById('sheetsUrl');
  if(sheetsUrlInput){
    getSettings().then(cfg=>{ sheetsUrlInput.value = cfg.sheetsUrl || ''; });
    sheetsUrlInput.addEventListener('change', ()=> setSettings({sheetsUrl: sheetsUrlInput.value.trim()}));
  }
  if(btnPush) btnPush.addEventListener('click', async ()=>{
    await autoSyncPush();
    await autoSyncPull();
    showToast('Synced ✓');
  });
  const btnLogout = document.getElementById('btnLogout');
  if(btnLogout) btnLogout.addEventListener('click', async ()=>{
    if(confirm('Sign out this device? Data on it stays put, but you\'ll need to sign in again next time.')){
      await doLogout();
    }
  });

  const btnExportJson = document.getElementById('btnExportJson');
  if(btnExportJson) btnExportJson.addEventListener('click', async ()=>{
    const flights = await dbGetAll('flights');
    const blob = new Blob([JSON.stringify(flights,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `flight-log-backup-${todayISO()}.json`;
    a.click();
  });
  const btnImportJson = document.getElementById('btnImportJson');
  if(btnImportJson) btnImportJson.addEventListener('click', ()=>document.getElementById('fileImportJson').click());

  const btnExportCsvAll = document.getElementById('btnExportCsvAll');
  if(btnExportCsvAll) btnExportCsvAll.addEventListener('click', async ()=>{
    const flights = await dbGetAll('flights');
    const cols = ['date','airline','flightNumber','origin','destination','depTime','arrTime','seat','pnr','aircraft','notes'];
    const lines = [cols.join(',')];
    for(const f of flights){
      lines.push(cols.map(c=>`"${(f[c]||'').toString().replace(/"/g,'""')}"`).join(','));
    }
    const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `flight-log-export-${todayISO()}.csv`;
    a.click();
  });

  const btnClearAll = document.getElementById('btnClearAll');
  if(btnClearAll) btnClearAll.addEventListener('click', async ()=>{
    if(confirm('Really delete ALL data from this device? This cannot be undone.')){
      const all = await dbGetAll('flights');
      for(const f of all) await dbDelete('flights', f.id);
      const photos = await dbGetAll('photos');
      for(const p of photos) await dbDelete('photos', p.flightId);
      await loadFlights();
      showToast('Cleared.');
      renderAll();
    }
  });
}
async function pushToSheets(){ await autoSyncPush(); }
async function pullFromSheets(){ await autoSyncPull(); }

/* --------------------------------- File inputs ------------------------------ */
document.getElementById('fileImportPdf').addEventListener('change', (e)=>{
  const f = e.target.files[0]; if(f) handlePdfFile(f); e.target.value='';
});
document.getElementById('fileImportImage').addEventListener('change', (e)=>{
  const f = e.target.files[0]; if(f) handleScanImageFile(f); e.target.value='';
});
document.getElementById('fileImportCsv').addEventListener('change', (e)=>{
  const f = e.target.files[0]; if(f) handleCsvFile(f); e.target.value='';
});
document.getElementById('fileImportJson').addEventListener('change', (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      let count = 0;
      for(const f of data){ if(f.id){ await dbPut('flights', f); count++; } }
      await loadFlights();
      showToast(`Restored ${count} flights ✓`);
      renderAll();
    }catch(err){ showToast('Could not read this file.'); }
  };
  reader.readAsText(f, 'utf-8');
  e.target.value='';
});
document.getElementById('fileImportPhoto').addEventListener('change', async (e)=>{
  const f = e.target.files[0];
  const targetId = state.photoUploadTargetId;
  e.target.value = '';
  if(!f || !targetId) return;
  showToast('Adding photo…');
  try{
    const dataUrl = await resizeImageToDataUrl(f);
    await savePhoto(targetId, dataUrl);
    await loadFlights();
    showToast('Photo added ✓');
    renderAll();
  }catch(err){
    console.error(err);
    showToast('Could not add that photo.');
  }
});

/* ----------------------------------- Init ------------------------------------ */
async function migrateFlightDates(){
  // One-off cleanup for flights saved before dates were normalized (e.g. a
  // CSV import that contained full UTC timestamps instead of plain dates).
  const all = await dbGetAll('flights');
  let changed = false;
  for(const f of all){
    if(f.date && f.date.includes('T')){
      const fixed = normalizeDateInput(f.date);
      if(fixed !== f.date){
        f.date = fixed;
        f.updatedAt = Date.now();
        await dbPut('flights', f);
        changed = true;
      }
    }
  }
  return changed;
}
async function init(){
  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('sw.js'); }catch(e){ /* sandboxed preview or file:// – app still works */ }
  }
  const cfg = await getSettings();
  if(cfg.sessionToken && await checkSession()){
    state.authed = true;
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = '';
    await loadAirports();
    await loadFlights();
    if(await migrateFlightDates()){ await loadFlights(); scheduleAutoSync(); }
    renderAll();
    autoSyncPull();
  } else {
    state.authed = false;
    renderLockScreen();
    loadAirports();
  }
}
init();
</script>
